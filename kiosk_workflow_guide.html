<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Ordering Kiosk - Simple User Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Noto+Sans+Sinhala:wght@600;700;800&family=Noto+Sans+Tamil:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070d1e;
      color: #ffffff;
      font-family: 'Outfit', 'Noto Sans Sinhala', 'Noto Sans Tamil', 'Nirmala UI', sans-serif;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrapper { max-width: 1200px; width: 100%; }
    .header { text-align: center; margin-bottom: 1.5rem; border: 2px solid #38bdf8; border-radius: 16px; padding: 1.5rem; background: #0f172a; }
    .main-title { font-size: 2.5rem; font-weight: 900; }
    .sub-title { font-size: 1.3rem; font-weight: 700; color: #7dd3fc; margin-top: 0.5rem; }
    .img-preview { width: 100%; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 2px solid #38bdf8; }
    .btn-row { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; }
    .btn { background: #2563eb; color: #fff; padding: 0.8rem 1.6rem; border-radius: 8px; font-weight: 800; text-decoration: none; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div style="color: #38bdf8; font-weight: 800; letter-spacing: 0.1em;">HAYLEYS ECO SOLUTIONS</div>
      <h1 class="main-title">MEAL ORDERING GUIDE</h1>
      <div class="sub-title">කෑම ඇණවුම් කිරීමේ සරල පියවර • உணவு முன்பதிவு எளிய வழிகாட்டி</div>
    </div>
    <img src="screenshots/user_workflow_guide.png" alt="Meal Ordering Guide Poster" class="img-preview">
    <div class="btn-row">
      <a href="screenshots/user_workflow_guide.png" download class="btn">⬇️ Download PNG Poster</a>
      <a href="javascript:window.print()" class="btn" style="background: #10b981;">🖨️ Print Poster</a>
    </div>
  </div>
</body>
</html>
